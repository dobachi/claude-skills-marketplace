# ai-tell-reducer 同梱辞書（日本語）
#
# これは禁止語リストではない。「見るべき場所」を見つけるための候補辞書である。
# 当たった箇所を直すかどうかは、各カテゴリの test（読み手への効果）で決める。
# 書式・追加の手順・昇格の基準は references/dictionary.md を読む。
#
#   [category:<名前>]   カテゴリ。label / test / ref を持つ
#   [<id>]              見出し語。category / pattern / example が必須
#                       counter = 当たってはいけない例（任意）
#                       fix     = この語に固有の直し方（任意）
#                       scope   = any（既定）/ heading / body
#                       added   = 追加した年月。流行語は古くなるので見直しの手がかりにする
#                       evidence = 根拠の強さ（カテゴリの既定値を見出し語で上書きできる）
#                           measured  実測でAI生成文に多いと報告された
#                           guideline 公的機関の指針が言い換え・回避を勧めている
#                           curated   他のツールや目録が挙げている（実測は無い）
#                           observed  このスキルを使った推敲で実際に見つかった
#                           folk      広く言われているが、実測で裏付けが無いか否定された
#                       source  = 出典の略号（references/dictionary.md の「出典」を参照）
#                       note    = 根拠についての注記（任意）
#
# 追加・変更したら必ず:  python3 scripts/dict_scan.py --selftest

# ───────────────────────── カテゴリ ─────────────────────────

[category:wago-figurative]
label = 和語の比喩的な転用
test = 字義どおりの動詞・漢語に置き換えて意味が通るか。通るなら置き換える。本書の用語として使うなら定義を置く
ref = japanese-word-choice.md#1
evidence = observed

[category:borrowed-metaphor]
label = 借り物の比喩・他分野の語
test = 比喩を外して具体的な中身が残るか（strip）。別の主題にもそのまま使えるか（swap）
ref = japanese-word-choice.md#2
evidence = curated

[category:vogue]
label = 流行語
test = この著者がこの媒体で、頼まれなくてもこの語を使うか
ref = expression-and-stance.md#E11
evidence = folk

[category:crowned]
label = 後付けの意味づけ・格上げ
test = その解釈や格付けを支える記述が原文にあるか。なければ事実だけを残す
ref = expression-and-stance.md#E4
evidence = curated

[category:calque-idiom]
label = 英語の慣用句・比喩の直訳
test = 英語に戻すと定型句になるか（逆翻訳）。日本語で最初から書くならどう書くか
ref = japanese-translationese.md#4
evidence = curated

[category:light-verb]
label = 軽い動詞＋名詞の直訳
test = 動詞・形容詞一語に戻せるか
ref = japanese-translationese.md#3
evidence = curated

[category:set-phrase]
label = チャットの決まり文句
test = 削って情報が減るか（deletion）
ref = japanese-translationese.md#5
evidence = curated

[category:katakana]
label = 未消化のカタカナ語
test = 読み手が説明なしで理解し、自分でも使う語か
ref = japanese-translationese.md#11
evidence = curated

[category:scaffold]
label = 前置き宣言・締めの定型
test = 削って情報が減るか（deletion）。節の範囲を示す唯一の文なら残す
ref = japanese-patterns.md#7
evidence = curated

[category:hedge]
label = 反射的な留保
test = 実際の不確かさを示しているか。示していなければ削る
ref = japanese-patterns.md#2
evidence = curated

[category:meta-claim]
label = 自己評価・自己弁護
test = 宣言を削り、それを実演している記述だけを残せるか
ref = japanese-patterns.md#14
evidence = curated

[category:inflated]
label = 膨らんだ言い回し
test = いちばん平易で正確な語に置き換えられるか
ref = japanese-patterns.md#3
evidence = curated

[category:connective]
label = 接続の癖
test = 削っても前後の関係が読み取れるか
ref = japanese-patterns.md#4
evidence = curated

[category:heading]
label = 論点を示さない見出し
test = 見出しだけを追って全体の内容がつかめるか
ref = japanese-word-choice.md#3
evidence = guideline
source = koyobun-2022

[category:hype]
label = 誇張・宣伝調
test = その評価を支える数値や事実が原文にあるか。あればそれを書き、なければ評価語を外す
ref = expression-and-stance.md#E7
evidence = curated
source = textlint-ai-writing

[category:stock-closer]
label = 課題と展望の決まり文句
test = 削って情報が減るか。誰が何をいつまでに行うのかが原文にあれば、それを書く
ref = expression-and-stance.md#E5
evidence = curated

[category:redundant]
label = 重複・回りくどい言い方
test = 短い形に直して意味が変わらないか
ref = japanese-patterns.md#15
evidence = guideline
source = koyobun-2022

# ───────────────────── 和語の比喩的な転用 ─────────────────────

[wago-kiku]
category = wago-figurative
pattern = 効(く|か|き|け|いて|いた)
