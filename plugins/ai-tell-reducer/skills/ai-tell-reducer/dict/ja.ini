# ─────────────────── 重複・回りくどい言い方 ───────────────────

[red-mazusaisho]
category = redundant
pattern = まず最初に|一番最初に|まず初めに
example = まず最初に前提を確認する
fix = まず／最初に
source = textlint-ai-writing
added = 2026-10

[red-kakugoto]
category = redundant
pattern = 各[^、。\s「」（）()の]{1,6}ごとに
example = 各部門ごとに集計する
counter = 各章の「節ごとに」を読む
fix = 各部門で／部門ごとに
note = 「各都道府県ごとに → 各都道府県で、都道府県ごとに」（Ⅱ-5 ウ（ア））
added = 2026-10

[red-yakukurai]
category = redundant
pattern = 約[0-9０-９一二三四五六七八九十百千万]+[^、。\s]{0,3}(くらい|ぐらい|ほど|程度)
example = 約20名くらいが参加した
fix = 約20名／20名くらい
note = 「約 20 名くらい → 約 20 名、20 名くらい」（Ⅱ-5 ウ（ア））
added = 2026-10

[red-jisshi]
category = redundant
pattern = の?(調査|変更|実装|確認|検討|作成|設定|分析|評価|整理|見直し)を(行|実施し|おこな)
example = 設定の変更を行う
counter = 調査を踏まえる
fix = 動詞に戻す（変更する／調査した）
note = 「調査を実施した → 調査した」（Ⅱ-5 ウ（イ））
added = 2026-10

[red-nijuhitei]
category = redundant
pattern = ないわけでは|ないとは(言|い)え|なくはない|ないこともない
example = 対応しないわけではない
fix = 肯定の形で書く（…することもある）
note = 「二重否定はどうしても必要なとき以外には使わない」（Ⅲ-4 コ）
added = 2026-10

[red-iumademonaku]
category = redundant
pattern = (言|い)うまでもなく|(言|い)うまでもない
example = 言うまでもなく、品質は重要である
fix = 削る。言うまでもないなら書かない
evidence = curated
source = textlint-ai-writing
added = 2026-10

[red-kakyuteki]
category = redundant
pattern = 可及的速やかに
example = 可及的速やかに対応する
fix = できる限り早く。期限が原文にあれば期限を書く
note = 「可及的速やかに → できる限り早く」（Ⅱ-6 ア）
added = 2026-10

