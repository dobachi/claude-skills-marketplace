# Generated by assets/find_pattern.py --gallery from references/figure-patterns/patterns.yaml.
# Do not edit by hand: change the catalog and regenerate. One slide per pattern,
# in catalog order (slide 1 is the title); the renders are references/figure-patterns/img/.
meta:
  aspect: '16:9'
slides:
- type: title
  title: 図のパターン集
  subtitle: references/figure-patterns/patterns.yaml から生成（find_pattern.py --gallery）
- type: figure
  title: 記録の義務があるのは EU だけ
  figure:
    kind: matrix
    corner: 項目
    columns:
    - EU
    - 米国
    - 日本
    marks:
    - mark: 義務
      tone: outline
      color: accent
      label: 法令で求める
    - mark: 任意
      tone: light
      label: 指針・任意
    - mark: —
      tone: none
      color: muted
      label: 定めなし
    legend: true
    rows:
    - label: 温度の記録
      cells:
      - mark: 義務
        text: 受け渡しごと
      - mark: 任意
        text: 指針あり
      - mark: 任意
    - label: 回収の追跡
      cells:
      - mark: 義務
      - mark: 義務
        text: 一つ前と後
      - mark: —
    - label: 包装の情報
      cells:
      - mark: 任意
      - mark: —
      - mark: 義務
        text: 表示の法律
  source: '出典: 説明用の例'
  notes: 'pattern: compare-matrix — 比較 — 複数の対象を同じ軸でそろえて比べる'
- type: figure
  title: 集中型は始めやすく、分散型は崩れにくい
  figure:
    kind: before_after
    arrow: false
    before:
      label: 集中型
      items:
      - 一か所にデータを集める
      - 運用者が全体を決める
      - 始めるのは早い
    after:
      label: 分散型
      items:
      - データは持ち主の手元に置く
      - 参加者が共通のルールに従う
      - 相手が増えても作り直さない
  source: '出典: 説明用の例'
  notes: 'pattern: a-vs-b — 二者の対比 — 二つの立場・方式を左右に並べる'
- type: figure
  title: 三つの表が一つの記録に置き換わる
  figure:
    kind: before_after
    change: 共有の記録へ
    before:
      label: いま
      items:
      - 病棟の在庫表
      - 薬剤部の払出表
      - 仕入先とのメール
    after:
      label: これから
      items:
      - label: 一つの記録
        text: 三者が同じものを読む
  source: '出典: 説明用の例'
  notes: 'pattern: before-after — 変化 — 今の状態と、変えたあとの状態'
- type: figure
  title: 四段のうち止まるのは承認だけ
  figure:
    kind: flow
    items:
    - 申請
    - 承認
    - 発注
    - 出荷
    highlight: 1
  source: '出典: 説明用の例'
  notes: 'pattern: process-flow — 順序 — 決まった順に進む手続き'
- type: steps
  title: 導入は三段で進め、二段目で参加者を決める
  steps:
  - label: 目的を決める
    text: 誰の何の困りごとか
  - label: 参加者をそろえる
    text: 最初の三者で始める
  - label: ルールを書く
    text: 使い方と記録の残し方
  notes: 'pattern: steps-detailed — 順序 — 各段に説明が要る手順'
- type: figure
  title: 補充は毎週回り、売れた数が次の予測に戻る
  figure:
    kind: cycle
    center:
      label: 毎週
    items:
    - label: 予測
      text: 先週の販売から
    - label: 発注
    - label: 配送
    - label: 販売
      edge: 実績が戻る
      tone: accent
  source: '出典: 説明用の例'
  notes: 'pattern: cycle — 循環 — 最後が最初に戻って繰り返す'
- type: figure
  title: 現場の記録が、次の設計の入力に戻る
  figure:
    kind: flow
    items:
    - 設計
    - 製造
    - 出荷
    - 現場で使う
    feedback: 使われ方の記録が設計に戻る
  source: '出典: 説明用の例'
  notes: 'pattern: feedback-loop — フィードバック — 一方向の流れに、結果が先頭へ戻る線'
- type: figure
  title: 調達課は二人の部長の両方に報告している
  figure:
    kind: tree
    direction: down
    root:
      label: 理事会
      children:
      - label: 診療部長
        children:
        - 病棟
        - 薬剤部
      - label: 管理部長
        children:
        - label: 調達課
          tone: accent
        - 施設課
  notes: 'pattern: hierarchy-org — 階層 — 上位が下位を束ねる関係'
- type: figure
  title: 納品の遅れは三つに分けられ、どれも手を打てる
  figure:
    kind: tree
    level_widths:
    - 1
    - 1
    - 1.6
    root:
      label: 納品の遅れ
      children:
      - label: 予測
        children:
        - 季節の山を外す
        - 病棟のデータが一週遅い
      - label: 発注
        children:
        - 承認の署名待ち
      - label: 輸送
        children:
        - 便の予約が遅い
        - label: 荷受け口の誤り
          tone: accent
  source: '出典: 説明用の例'
  notes: 'pattern: logic-tree — 分解 — 一つの問いや数字を、漏れなく重なりなく分ける'
- type: figure
  title: 三つの原因が重なって欠品になる
  figure:
    kind: tree
    direction: left
    root:
      label: 欠品
      tone: accent
      children:
      - 予測が低すぎる
      - 発注が遅れる
      - 配送が抜ける
  source: '出典: 説明用の例'
  notes: 'pattern: cause-effect — 因果 — いくつかの原因が一つの結果を生む'
- type: figure
  title: 三つの記録が一つの在庫の見え方にまとまる
  figure:
    kind: diagram
    edge_route: elbow
    nodes:
    - id: a
      label: 病棟の記録
      col: 0
      row: 0
    - id: b
      label: 薬剤部の記録
      col: 0
      row: 1
    - id: c
      label: 仕入先の出荷
      col: 0
      row: 2
    - id: z
      label: 一つの在庫の見え方
      col: 2
      row: 1
      tone: accent
    edges:
    - from: a
      to: z
    - from: b
      to: z
    - from: c
      to: z
  source: '出典: 説明用の例'
  notes: 'pattern: convergence — 収束 — 複数の入力が一つにまとまる'
- type: figure
  title: 一度そろえたデータを、三つの用途で使い回す
  figure:
    kind: diagram
    edge_route: elbow
    nodes:
    - id: s
      label: そろえたデータ
      col: 0
      row: 1
      tone: accent
    - id: a
      label: 需要の予測
      col: 2
      row: 0
    - id: b
      label: 回収の追跡
      col: 2
      row: 1
    - id: c
      label: 当局への報告
      col: 2
      row: 2
    edges:
    - from: s
      to: a
    - from: s
      to: b
    - from: s
      to: c
  source: '出典: 説明用の例'
  notes: 'pattern: divergence — 発散 — 一つのものが複数に広がる'
- type: figure
  title: 取引所が、すべての参加者を一点でつなぐ
  figure:
    kind: hub
    center:
      label: 取引所
    items:
    - 病棟
    - 薬剤部
    - 仕入先
    - 運送会社
    - 経理
  source: '出典: 説明用の例'
  notes: 'pattern: hub-spoke — 中心 — 一つの中心が、周りのそれぞれとだけつながる'
- type: figure
  title: 規則は三つの強さに分かれる
  figure:
    kind: bands
    cols: 3
    bands:
    - label: 法律
      items:
      - label: EU
        text: 規則
      - label: 米国
        text: 連邦法
      - label: 日本
        text: 食品衛生法
    - label: 標準
      items:
      - label: 事象データの標準
        span: 2
      - 食品安全の規格
    - label: 任意
      tone: light
      items:
      - 小売の取り決め
      - label: 運送の約束
        span: 2
  source: '出典: 説明用の例'
  notes: 'pattern: layers — 層 — 下の層が上の層を支える'
- type: figure
  title: 費用の半分はデータを整える作業
  figure:
    kind: stacked_bar
    height: 0.6
    segments:
    - label: 整える 50%
      value: 0.5
      tone: accent
    - label: 集める 30%
      value: 0.3
      tone: light
    - label: 分析 20%
      value: 0.2
      tone: light
  source: '出典: 説明用の例'
  notes: 'pattern: part-whole — 構成 — 全体のうち、それぞれが占める割合'
- type: matrix
  title: 並列承認は、早く始められて効果も大きい
  x_axis:
  - 着手が遅い
  - 着手が早い
  y_axis:
  - 効果が小さい
  - 効果が大きい
  quadrants:
  - label: 制度改正
    text: 効果は大きいが半年かかる
  - label: 並列承認
    text: 規程の変更だけで来月から
  - label: 帳票の統合
    text: 効果は限定的で手間が大きい
  - label: テンプレートの整備
    text: すぐ効くが効果は小さい
  emphasis: 2
  notes: 'pattern: matrix-2x2 — 位置づけ — 二つの軸で四つに分ける'
- type: figure
  title: 共有の記録は、三者の必要が重なるところにある
  figure:
    kind: venn
    height: 3.8
    sets:
    - label: 病棟
      text: 棚にあるもの
    - label: 薬剤部
      text: 払い出したもの
    - label: 仕入先
      text: 届く途中のもの
    overlap: 共有の記録
  notes: 'pattern: venn — 重なり — 二つか三つの集まりが共有する部分'
- type: figure
  title: 申請の三分の二は、承認の前に消える
  figure:
    kind: funnel
    items:
    - label: 申請
      value: 1,200件
    - label: 審査
      value: 700件
    - label: 承認
      value: 410件
      tone: accent
  source: '出典: 説明用の例'
  notes: 'pattern: funnel — 絞り込み — 段を経るごとに数が減る'
- type: figure
  title: 判断に使えるのは、下の二段がそろったときだけ
  figure:
    kind: pyramid
    items:
    - label: 洞察
      text: なぜ欠品したか
      tone: accent
    - label: 情報
      text: 病棟別・日別の在庫
    - label: データ
      text: 棚ごとの読み取りの記録
  source: '出典: 説明用の例'
  notes: 'pattern: pyramid — 積み上がり — 広い土台の上に、少ないが上位のものが載る'
- type: figure
  title: 発注は出荷までに三つの部署を渡る
  figure:
    kind: swimlane
    lanes:
    - id: w
      label: 病棟
    - id: s
      label: 調達課
    - id: v
      label: 仕入先
    steps:
    - id: r
      lane: w
      col: 0
      label: 依頼
    - id: a
      lane: s
      col: 1
      label: 承認
      tone: accent
    - id: o
      lane: s
      col: 2
      label: 発注
    - id: p
      lane: v
      col: 3
      label: 出荷
    edges:
    - from: r
      to: a
    - from: a
      to: o
    - from: o
      to: p
      label: 電子発注
  source: '出典: 説明用の例'
  notes: 'pattern: swimlane — 役割分担 — 流れの各段を、どの担い手が受け持つか'
- type: figure
  title: 試行は予定どおり進み、次は 9 月の判断
  figure:
    kind: timeline
    today: 7月
    items:
    - date: 4月
      label: 開始
    - date: 5月
      label: 三者の合意
    - date: 7月
      label: 試行
      text: いまここ
    - date: 9月
      label: 継続の判断
  source: '出典: 説明用の例'
  notes: 'pattern: timeline — 時系列 — いつ何が起きたか、今どこにいるか'
- type: figure
  title: 三つの取り組みを重ね、後半に一つにする
  figure:
    kind: bands
    cols: 4
    label_width: 1.6
    band_height: 0.55
    bands:
    - label: 期間
      tone: none
      items:
      - label: 上期前半
        tone: none
      - label: 上期後半
        tone: none
      - label: 下期前半
        tone: none
      - label: 下期後半
        tone: none
    - label: 合意
      items:
      - label: 三者で合意
        span: 2
    - label: 仕組み
      items:
      - label: ''
        tone: none
      - label: 記録の共有
        span: 2
    - label: 運用
      items:
      - label: ''
        tone: none
        span: 2
      - label: 全病棟へ
        span: 2
        tone: accent
  source: '出典: 説明用の例'
  notes: 'pattern: roadmap — 計画 — 並行する取り組みを、期間の上に並べる'
- type: figure
  title: 三段目の「組織の間で使う」が目標
  figure:
    kind: staircase
    height: 1.8
    items:
    - label: 集める
      text: 部署ごと
    - label: そろえる
      text: 社内で
    - label: 組織の間で使う
      text: 相手と
  source: '出典: 説明用の例'
  notes: 'pattern: maturity-staircase — 段階 — 一段ずつ上がる成熟度・水準'
- type: figure
  title: 価値は出荷の後の使われ方から生まれる
  figure:
    kind: diagram
    cols: 4
    nodes:
    - id: a
      label: 調達
      col: 0
      row: 0
    - id: b
      label: 製造
      col: 1
      row: 0
    - id: c
      label: 出荷
      col: 2
      row: 0
    - id: d
      label: 使われ方を知る
      col: 3
      row: 0
      tone: accent
    - id: s1
      label: 人と組織
      col: 0
      row: 1
      colspan: 4
      tone: light
    - id: s2
      label: データの基盤
      col: 0
      row: 2
      colspan: 4
      tone: light
    edges:
    - from: a
      to: b
    - from: b
      to: c
    - from: c
      to: d
  source: '出典: 説明用の例'
  notes: 'pattern: value-chain — 価値の連鎖 — 主な活動の連なりと、それを支える活動'
- type: figure
  title: 欠品は半分になり、在庫は増えていない
  figure:
    kind: tiles
    items:
    - number: -48%
      label: 欠品
      delta: 前年同期比
      tone: accent
    - number: +2%
      label: 在庫金額
      delta: 前年同期比
    - number: 3日
      label: 発注から納品
      delta: 5日から
  source: '出典: 説明用の例'
  notes: 'pattern: kpi-tiles — 数字 — 状態を表す少数の数'
- type: figure
  title: 記録は取り決めた範囲だけ外と共有する
  figure:
    kind: diagram
    edge_label_pos: line
    gap_x: 1.3
    groups:
    - label: 病院の中
      col: 0
      row: 0
      colspan: 2
    nodes:
    - id: w
      label: 病棟
      col: 0
      row: 0
    - id: r
      label: 共有の記録
      col: 1
      row: 0
      tone: accent
    - id: v
      label: 仕入先
      col: 2
      row: 0
    edges:
    - from: w
      to: r
      label: 読み取り
    - from: r
      to: v
      label: 合意の項目
  source: '出典: 説明用の例'
  notes: 'pattern: system-context — 関係 — 誰と何が、何を受け渡してつながっているか'
- type: figure
  title: 判断と合意のループは、二つの土台の上で回る
  figure:
    kind: stack
    parts:
    - kind: cycle
      title: 回る仕組み
      height: 1.9
      items:
      - 分析
      - 判断
      - 合意
      - 実行
    - kind: bands
      title: 支える土台
      label_width: 1.6
      bands:
      - label: 共通の言葉
        items:
        - 品目コード
        - ロット番号
        - 単位
      - label: 信頼
        tone: accent
        items:
        - label: 誰が何をしてよいかと、その記録
          span: 3
  source: '出典: 説明用の例'
  notes: 'pattern: loop-on-layers — 循環と層 — 回る仕組みと、それを支える土台'
- type: figure
  title: 課題ごとに、効く仕組みが一つずつある
  figure:
    kind: matrix
    flow: true
    label_width: 0
    columns:
    - 課題
    - 仕組み
    - ねらい
    rows:
    - cells:
      - 傷みに気づくのが遅い
      - 一時間ごとに温度を送る
      - text: 捨てる量を減らす
        tone: accent
    - cells:
      - 回収に何週間もかかる
      - ロット番号を荷と一緒に渡す
      - text: 一日で回収する
        tone: accent
  source: '出典: 説明用の例'
  notes: 'pattern: problem-solution — 対応 — 課題ごとに、効く仕組みとねらいを並べる'
- type: cards
  title: 公平性は三つの柱で支える
  cards:
  - label: 開かれた参加
    text: 小さな事業者も入れる
  - label: 透明な運営
    text: ルールの決め方を見せる
  - label: 開かれた標準
    text: 特定の製品に縛られない
  notes: 'pattern: parallel-set — 並列 — 同じ種類で順序のない二〜四つ'
