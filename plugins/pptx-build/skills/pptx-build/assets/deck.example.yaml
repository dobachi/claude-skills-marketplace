# Example deck spec for build_deck.py
# Default look:    python3 build_deck.py deck.example.yaml -o /tmp/out.pptx
# Into a template: python3 build_deck.py deck.example.yaml -o /tmp/out.pptx --template corp.pptx
#
# meta.* overrides the active theme for this deck IN DEFAULT MODE (ignored when
# --template is used — the template owns the look). Omit any key to keep the
# theme default. Keep it quiet: one accent, white bg, action titles.
meta:
  aspect: "16:9"            # or "4:3"
  bg: "FFFFFF"              # FAFAFA for a softer paper white
  ink: "1A1A1A"
  accent: "2F5DA8"          # a single restrained accent — hairline + emphasis only
  rule: true                # short master-level hairline (NOT a full-width band)
  font_heading: "Yu Gothic Medium"
  font_body: "Yu Gothic"

slides:
  - type: title
    title: "新サービスの市場投入計画"
    subtitle: "2026年度 第2四半期レビュー"

  - type: section
    number: "01"
    title: "現状と課題"

  - type: bullets
    title: "解約率は3四半期連続で低下、ただし新規獲得が鈍化"   # action title = conclusion
    bullets:
      - "解約率は前年同期比で4.2pt改善"
      - text: "改善はエンタープライズ契約の更新が牽引"
        level: 1
      - "一方、新規MRRは2四半期連続で前期割れ"
      - text: "中小セグメントのCACが上昇"
        level: 1
    source: "出典: 社内BIダッシュボード 2026-05集計"

  - type: two_col
    title: "強みは定着、弱みは入口にある"
    left:
      heading: "効いている施策"
      bullets:
        - "オンボーディング改善"
        - "カスタマーサクセスの増員"
    right:
      heading: "効いていない施策"
      bullets:
        - "上位プランへの誘導"
        - "紹介プログラム"

  - type: big_number
    title: "更新率は過去最高水準に到達"
    number: "94%"
    caption: "エンタープライズ契約の年間更新率"
    source: "出典: 契約管理システム"

  - type: image
    title: "獲得から定着までを1本のファネルで捉える"
    image: "figures/funnel.png"          # 無ければプレースホルダが描画され、ビルドは継続
    caption: "図1: 獲得〜定着ファネルと各段の転換率"     # 太字の読みやすいラベル
    note: >                                # 図の意味を補う説明（脚注ではなく本文級の可読サイズ）
      入口（無料トライアル）の転換率は業界平均並みだが、オンボーディング完了率が
      定着の最大のドライバーになっている。改善余地は上段ではなく中段にある。
    source: "出典: 社内BIダッシュボード 2026-05集計"

  - type: cards
    title: "打ち手は3つに絞れる"
    cards:
      - {label: "獲得", text: "中小向け広告を縮小し、紹介設計へ再配分"}
      - {label: "定着", text: "オンボーディング完了率を主要KPIに昇格"}
      - {label: "拡張", text: "上位プラン誘導は一度止め、来期に再設計"}
    emphasis: 1

  - type: statement
    text: "伸びを止めているのは定着ではなく入口である"
    sub: "以降はこの前提で読んでください"

  - type: quote
    quote: "顧客は製品を買うのではなく、進歩を雇用する。"
    attribution: "Clayton Christensen"

  - type: section
    number: "02"
    title: "次の一手"

  - type: bullets
    title: "獲得チャネルへ投資を再配分する"
    bullets:
      - "中小セグメントの広告予算を縮小"
      - "エンタープライズの紹介設計に再投資"
      - "プロダクト主導の無料トライアルを試験導入"

  # 表は body プレースホルダの領域に入り、そのプレースホルダ識別子を引き継ぐ
  # （＝マスタ管理下のまま）。手書きの python-pptx に逃げる必要はない。
  - type: table
    title: "再配分後は獲得単価が2割下がる見込み"
    columns: ["チャネル", "現行予算", "再配分後", "獲得単価"]
    rows:
      - ["中小向け広告", "1,200万円", "600万円", "▲8%"]
      - ["エンタープライズ紹介", "300万円", "700万円", "▲26%"]
      - ["無料トライアル", "0円", "200万円", "検証中"]
    widths: [2, 1, 1, 1]
    source: "出典: 社内試算 2026-05"

  # グラフも同様。凡例は系列が2本以上のときだけ自動で出る。
  - type: chart
    title: "紹介経由の獲得は3四半期連続で伸びている"
    chart: column
    categories: ["Q1", "Q2", "Q3"]
    series:
      - name: "紹介経由"
        values: [38, 52, 71]
    source: "出典: 月次KPIレポート 2026-05"
