    text: "この文はあまりにも長すぎて一息では読めないし、宣言として機能しないうえに、句読点としての役割も果たさない"
    bullets: ["余計な箇条書き"]
  - type: lead
    title: "主役がない"
    rest: [{label: "A"}, {label: "B"}, {label: "C"}, {label: "D"}]
