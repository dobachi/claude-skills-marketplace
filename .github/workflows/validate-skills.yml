name: Validate skills

# Guards the skill contract: every SKILL.md must have valid YAML frontmatter,
# a name that matches its directory and is registered, and a non-empty
# description. Runs on any change under plugins/ or to the marketplace/registry.
# This is the automated form of the manual checks in
# docs/adding-or-updating-a-skill.md — nothing shipped without it before.

on:
  push:
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - "tools/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - "tools/validate_skills.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        # PyYAML for the validator itself, plus whatever each skill declares in
        # its own assets/requirements.txt (pptx-build needs python-pptx). Without
        # this a bundled harness dies on ModuleNotFoundError, which reads as a
        # broken skill rather than as a missing dependency on the runner.
        run: |
          pip install pyyaml
          for r in plugins/*/skills/*/assets/requirements.txt; do
            [ -f "$r" ] || continue
            echo "== $r"
            pip install -r "$r"
          done

      - name: Validate SKILL.md files
        run: python3 tools/validate_skills.py

      - name: Run bundled skill test harnesses
        # Skills that ship a deterministic harness run it here. A skill whose
        # script silently stops detecting anything reads exactly like a clean
        # pass otherwise - that is how the nested-document bug shipped.
        run: |
          set -e
          fail=0
          for h in plugins/*/skills/*/tests/run_tests.sh \
                   plugins/*/skills/*/detectors/test_detectors.sh; do
            [ -f "$h" ] || continue
            echo "== $h"
            bash "$h" || fail=1
          done
          exit $fail
